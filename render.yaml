services:
  - type: web
    name: srm-resolve
    runtime: docker
    plan: free
    region: singapore
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /welcome
    envVars:
      - key: PORT
        value: 8080
      - key: TZ
        value: Asia/Kolkata
      - key: APP_DEMO_MODE
        value: "true"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false

