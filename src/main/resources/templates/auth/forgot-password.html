<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password: SRM-Resolve</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/theme.css}">
</head>
<body class="bg-light">

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card border-0 shadow-sm p-4 rounded-4">
                <div class="text-center mb-4">
                    <span class="fs-1">🔑</span>
                    <h4 class="fw-bold text-dark mt-2">Reset Password</h4>
                    <p class="text-muted small">Verify your identity via institutional OTP to reset your password.</p>
                </div>

                <!-- Alert Messages -->
                <div th:if="${errorMessage}" class="alert alert-danger py-2 small" th:text="${errorMessage}"></div>
                <div th:if="${successMessage}" class="alert alert-success py-2 small" th:text="${successMessage}"></div>

                <!-- Step 1: Request OTP -->
                <form th:if="${!otpSent}" th:action="@{/auth/forgot-password}" method="post">
                    <div class="mb-3">
                        <label class="form-label small fw-semibold">Registration Number or Email</label>
                        <input type="text" name="regNoOrEmail" class="form-control" placeholder="e.g. AP25110070893 or student@srmap.edu.in" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold rounded-pill">
                        <i class="bi bi-send-fill me-1"></i> Send Verification OTP
                    </button>
                </form>

                <!-- Step 2: Enter OTP and New Password -->
                <form th:if="${otpSent}" th:action="@{/auth/reset-password}" method="post">
                    <input type="hidden" name="regNoOrEmail" th:value="${regNoOrEmail}">

                    <div class="mb-3">
                        <label class="form-label small fw-semibold">6-Digit Verification OTP</label>
                        <input type="text" name="otp" class="form-control text-center fw-bold fs-5 tracking-wide" 
                               maxlength="6" th:value="${demoOtp}" placeholder="123456" required autofocus>
                        <div class="form-text small text-success" th:if="${demoOtp}">
                            <i class="bi bi-info-circle"></i> Verification code pre-filled.
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label small fw-semibold">New Password</label>
                        <input type="password" name="newPassword" class="form-control" placeholder="Minimum 6 characters" required minlength="6">
                    </div>

                    <button type="submit" class="btn btn-success w-100 py-2 fw-semibold rounded-pill">
                        <i class="bi bi-check-circle-fill me-1"></i> Confirm & Reset Password
                    </button>
                </form>

                <div class="text-center mt-4">
                    <a th:href="@{/auth/login}" class="text-decoration-none small">
                        <i class="bi bi-arrow-left me-1"></i> Back to Sign In
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
