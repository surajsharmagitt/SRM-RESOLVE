<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<div th:fragment="navbar(activeTab)">
    <!-- Main University Navigation Bar (CampusFix Clean Style) -->
    <nav class="navbar navbar-expand-lg navbar-dark shadow-sm sticky-top" style="background: linear-gradient(135deg, #002147 0%, #00152e 100%); border-bottom: 2px solid #2563eb;">
        <div class="container-fluid px-3 px-lg-4">
            <a class="navbar-brand d-flex align-items-center gap-2" th:href="@{/welcome}">
                <span class="fs-4">🏛️</span>
                <div class="d-flex flex-column">
                    <span class="fw-bold tracking-tight text-white mb-0" style="font-size: 1.15rem; letter-spacing: -0.5px;">SRM-RESOLVE</span>
                    <span class="text-white-50" style="font-size: 0.7rem; line-height: 1;">Campus Infrastructure Platform</span>
                </div>
            </a>

            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMain">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarMain">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-3 gap-1">
                    <!-- Student Grievances (Visible ONLY to students) -->
                    <li class="nav-item" sec:authorize="hasRole('STUDENT')">
                        <a class="nav-link px-3 rounded-2" 
                           th:classappend="${activeTab == 'student' ? 'active fw-bold text-white bg-white bg-opacity-10' : 'text-white-50'}" 
                           th:href="@{/student/dashboard}">
                            <i class="bi bi-mortarboard me-1"></i> My Grievances
                        </a>
                    </li>
                    <li class="nav-item" sec:authorize="hasRole('STUDENT')">
                        <a class="nav-link px-3 rounded-2" 
                           th:classappend="${activeTab == 'profile' ? 'active fw-bold text-white bg-white bg-opacity-10' : 'text-white-50'}" 
                           th:href="@{/student/profile}">
                            <i class="bi bi-person-badge me-1"></i> Profile &amp; Room
                        </a>
                    </li>

                    <!-- Department Hub (Visible to Staff, Head, Executive, Admin) -->
                    <li class="nav-item" sec:authorize="hasAnyRole('DEPT_STAFF', 'DEPT_HEAD')">
                        <a class="nav-link px-3 rounded-2" 
                           th:classappend="${activeTab == 'hub' ? 'active fw-bold text-white bg-white bg-opacity-10' : 'text-white-50'}" 
                           th:href="@{/department/hub}">
                            <i class="bi bi-chat-left-dots-fill me-1"></i> Department Hub
                        </a>
                    </li>

                    <!-- SLA & Staff Operations (Visible to Dept Head) -->
                    <li class="nav-item" sec:authorize="hasRole('DEPT_HEAD')">
                        <a class="nav-link px-3 rounded-2" 
                           th:classappend="${activeTab == 'head' ? 'active fw-bold text-white bg-white bg-opacity-10' : 'text-white-50'}" 
                           th:href="@{/department/head}">
                            <i class="bi bi-shield-check me-1"></i> SLA Operations
                        </a>
                    </li>

                    <!-- VC Leadership Radar (Visible to Executive and Admin) -->
                    <li class="nav-item" sec:authorize="hasAnyRole('EXECUTIVE', 'ADMIN')">
                        <a class="nav-link px-3 rounded-2" 
                           th:classappend="${activeTab == 'vc' ? 'active fw-bold text-white bg-white bg-opacity-10' : 'text-white-50'}" 
                           th:href="@{/executive/dashboard}">
                            <i class="bi bi-radar me-1"></i> VC Leadership Radar
                        </a>
                    </li>

                    <!-- Executive Oversight for Depts -->
                    <li class="nav-item" sec:authorize="hasAnyRole('EXECUTIVE', 'ADMIN')">
                        <a class="nav-link px-3 rounded-2" 
                           th:classappend="${activeTab == 'head' ? 'active fw-bold text-white bg-white bg-opacity-10' : 'text-white-50'}" 
                           th:href="@{/department/head}">
                            <i class="bi bi-shield-check me-1"></i> Department SLA Oversight
                        </a>
                    </li>
                </ul>

                <div class="d-flex align-items-center gap-3 ms-auto mt-2 mt-lg-0">
                    <div class="d-flex align-items-center gap-2 text-white bg-white bg-opacity-10 px-3 py-1 rounded-pill small" sec:authorize="isAuthenticated()">
                        <i class="bi bi-person-circle fs-6 text-warning"></i>
                        <span class="fw-semibold text-white" sec:authentication="name">User</span>
                    </div>

                    <form th:action="@{/auth/logout}" method="post" class="d-inline" sec:authorize="isAuthenticated()">
                        <button type="submit" class="btn btn-outline-light btn-sm px-3 rounded-pill">
                            <i class="bi bi-box-arrow-right me-1"></i> Logout
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </nav>
</div>
</body>
</html>
