<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authority Login: SRM-Resolve</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --font-main: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            --cf-navy: #0f172a;
        }

        body {
            font-family: var(--font-main);
            color: var(--cf-navy);
            background: linear-gradient(180deg, #f0f7ff 0%, #f8fafc 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem 1rem;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: #64748b;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            transition: color 0.2s ease;
        }

        .back-link:hover {
            color: #0284c7;
        }

        .login-card {
            background: #ffffff;
            border-radius: 1.5rem;
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.08), 0 0 1px 1px rgba(0, 0, 0, 0.04);
            width: 100%;
            max-width: 440px;
            overflow: hidden;
            border: 1px solid #e2e8f0;
        }

        .card-header-gradient {
            background: linear-gradient(135deg, #0369a1 0%, #0c4a6e 100%);
            padding: 2.5rem 2rem 2rem;
            text-align: center;
            color: #ffffff;
        }

        .header-icon-box {
            width: 56px;
            height: 56px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 1rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            margin-bottom: 1rem;
        }

        .card-header-gradient h2 {
            font-size: 1.5rem;
            font-weight: 800;
            margin-bottom: 0.35rem;
            letter-spacing: -0.5px;
        }

        .card-header-gradient p {
            font-size: 0.875rem;
            opacity: 0.85;
            margin-bottom: 0;
        }

        .card-body-custom {
            padding: 2rem;
        }

        .form-control-custom {
            border: 1px solid #cbd5e1;
            border-radius: 0.75rem;
            padding: 0.75rem 1rem 0.75rem 2.75rem;
            font-size: 0.95rem;
            transition: all 0.2s ease;
        }

        .form-control-custom:focus {
            border-color: #0284c7;
            box-shadow: 0 0 0 4px rgba(2, 132, 199, 0.12);
        }

        .input-icon-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            font-size: 1.1rem;
            pointer-events: none;
        }

        .btn-submit {
            background: #0284c7;
            color: #ffffff;
            font-weight: 700;
            border: none;
            border-radius: 0.75rem;
            padding: 0.8rem;
            width: 100%;
            font-size: 1rem;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.25);
        }

        .btn-submit:hover {
            background: #0369a1;
            transform: translateY(-1px);
        }

        .quick-fill-btn {
            font-size: 0.75rem;
            padding: 0.25rem 0.65rem;
            border-radius: 9999px;
        }
    </style>
</head>
<body>

<div class="w-100 max-w-440" style="max-width: 440px;">
    <!-- Back to Home -->
    <a th:href="@{/welcome}" class="back-link">
        <i class="bi bi-arrow-left"></i> Back to home
    </a>

    <!-- Card -->
    <div class="login-card">
        <!-- Gradient Header -->
        <div class="card-header-gradient">
            <div class="header-icon-box">
                <i class="bi bi-wrench-adjustable-circle-fill"></i>
            </div>
            <h2>Authority Login</h2>
            <p>Department Staff &amp; Maintenance Officers</p>
        </div>

        <!-- Body -->
        <div class="card-body-custom">
            <!-- Flash Alerts -->
            <div th:if="${errorMessage}" class="alert alert-danger py-2 small mb-3" th:text="${errorMessage}"></div>

            <!-- Authority Login Form -->
            <form th:action="@{/auth/login-process}" method="post">
                <div class="mb-3">
                    <label class="form-label small fw-semibold text-muted">Authority Email or Staff ID</label>
                    <div class="input-icon-wrapper">
                        <i class="bi bi-person-badge input-icon"></i>
                        <input type="text" id="usernameInput" name="username" class="form-control form-control-custom"
                               placeholder="e.g. water.staff1@srmap.edu.in" required autofocus>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label small fw-semibold text-muted">Password</label>
                    <div class="input-icon-wrapper">
                        <i class="bi bi-key input-icon"></i>
                        <input type="password" id="passwordInput" name="password" class="form-control form-control-custom"
                               placeholder="Enter your password" required>
                    </div>
                </div>

                <button type="submit" class="btn-submit d-flex align-items-center justify-content-center gap-2 mb-3">
                    <i class="bi bi-box-arrow-in-right"></i> Sign In to Department Hub
                </button>

                <div class="mt-3 p-3 bg-light rounded-3 border small text-muted">
                    <div class="fw-bold text-dark mb-2"><i class="bi bi-lightning-charge-fill text-warning me-1"></i> Quick Test Authority Accounts (1-Click Fill):</div>
                    <div class="d-flex flex-wrap gap-2 mb-2">
                        <button type="button" class="btn btn-sm btn-outline-primary py-1 px-2" onclick="fillCreds('water.staff1@srmap.edu.in', 'staff123')">
                            💧 Water Staff
                        </button>
                        <button type="button" class="btn btn-sm btn-outline-primary py-1 px-2" onclick="fillCreds('hostel.staff1@srmap.edu.in', 'staff123')">
                            🏢 Hostel Staff
                        </button>
                        <button type="button" class="btn btn-sm btn-outline-primary py-1 px-2" onclick="fillCreds('water.head@srmap.edu.in', 'staff123')">
                            👔 Dept Head (Water)
                        </button>
                        <button type="button" class="btn btn-sm btn-outline-secondary py-1 px-2" onclick="fillCreds('itkm.staff1@srmap.edu.in', 'staff123')">
                            💻 ITKM Staff
                        </button>
                    </div>
                    <div class="text-muted" style="font-size: 0.75rem;">Default institutional password: <code>staff123</code></div>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    function fillCreds(u, p) {
        document.getElementById('usernameInput').value = u;
        document.getElementById('passwordInput').value = p;
    }
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
