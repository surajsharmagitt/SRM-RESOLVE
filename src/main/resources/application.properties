# Application
spring.application.name=srm-resolve
server.port=${PORT:8080}

# MySQL Datasource
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/srm_resolve?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata&createDatabaseIfNotExist=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Schema & Data Initialization
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql
spring.sql.init.continue-on-error=false

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=25MB
app.upload.dir=${user.home}/srm-resolve-uploads

# Mail (Gmail SMTP Integration)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:surajxsharma.in@gmail.com}
spring.mail.password=${MAIL_PASSWORD:cmzkykhwsixfsvbt}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
app.mail.from=${MAIL_FROM:surajxsharma.in@gmail.com}
app.mail.allowed-domains=srmap.edu.in,srmist.edu.in,gmail.com

# SLA Configuration
app.sla.check-interval-ms=60000

# Incident Grouping
app.grouping.window-hours=6
app.grouping.jaccard-threshold=0.35

# Demo Mode
app.demo-mode=false

# Timezone
spring.jackson.time-zone=Asia/Kolkata

# Logging
logging.level.com.srmresolve=DEBUG
logging.level.org.springframework.jdbc=DEBUG
