# Application
spring.application.name=srm-resolve
server.port=${PORT:8080}

# MySQL Datasource
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/srm_resolve?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata&createDatabaseIfNotExist=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Schema & Data Initialization
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql
spring.sql.init.continue-on-error=false

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=25MB
app.upload.dir=${user.home}/srm-resolve-uploads

# Transactional Mail (Brevo HTTPS API - Outbound port 443 supported on Render Free)
app.mail.brevo-api-key=${BREVO_API_KEY:}
app.mail.brevo-sender-email=${BREVO_SENDER_EMAIL:}
app.mail.brevo-sender-name=${BREVO_SENDER_NAME:SRM-Resolve Campus Support}

# SMTP Fallback (For local testing or unblocked SMTP environments)
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=${SPRING_MAIL_HOST:smtp.gmail.com}
app.mail.from=${MAIL_FROM:noreply@srmap.edu.in}
app.mail.allowed-domains=srmap.edu.in,srmist.edu.in

# SLA Configuration
app.sla.check-interval-ms=60000

# Incident Grouping
app.grouping.window-hours=6
app.grouping.jaccard-threshold=0.35

# Demo Mode & Evaluation Passkey 123456
app.demo-mode=${APP_DEMO_MODE:true}

# Timezone
spring.jackson.time-zone=Asia/Kolkata

# Logging
logging.level.com.srmresolve=DEBUG
logging.level.org.springframework.jdbc=DEBUG
