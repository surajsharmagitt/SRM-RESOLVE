# Test profile uses MySQL 8 (local or testcontainer)
spring.datasource.url=jdbc:mysql://localhost:3306/srm_resolve?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql
spring.sql.init.continue-on-error=false

# Disable mail in tests
spring.mail.host=localhost
spring.mail.port=25
app.mail.from=test@srmap.edu.in

# SLA
app.sla.check-interval-ms=60000

# Grouping
app.grouping.window-hours=6
app.grouping.jaccard-threshold=0.35

# Demo
app.demo-mode=true

# Logging
logging.level.com.srmresolve=DEBUG
